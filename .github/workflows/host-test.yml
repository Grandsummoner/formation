name: host-test
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: sh tests/run_host.sh tests/full.txt
      - name: No floating point, no 64-bit division
        run: "! grep -nE '\\b(float|double|long long|int64_t|uint64_t)\\b' firmware/src/navyarp2.c"
